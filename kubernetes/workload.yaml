apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: observability-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-generator
  template:
    metadata:
      labels:
        app: log-generator
    spec:
      containers:
        - name: log-generator
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                echo "$(date -Iseconds) INFO order processed id=$i"
                if [ $((i % 10)) -eq 0 ]; then
                  echo "$(date -Iseconds) ERROR payment gateway timeout id=$i" >&2
                fi
                sleep 2
              done
